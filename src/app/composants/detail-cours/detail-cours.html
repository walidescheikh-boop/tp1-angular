@if (cours) {
<aside class="detail-cours">
<h2>{{ cours.titre }}</h2>
<p>Catégorie : {{ cours.categorie }}</p>
<p>Durée : {{ cours.duree }}</p>
<p>Places disponibles : {{ cours.places }}</p>
</aside>
} @else {
<aside class="detail-cours detail-cours--vide">
<p>Sélectionnez un cours dans la liste pour voir son détail.</p>
</aside>
}
